name: zroyecto-pombie

# ============================================================================
# Zroyecto Pombie - servidor dedicado de Project Zomboid (Build 42)
# ============================================================================
#
# Dos servicios con la MISMA imagen y configuracion, pero datos completamente
# separados:
#
#   pz          produccion. El mundo de verdad.
#   pz-staging  ensayo. Se levanta con una copia del mundo real, en otros
#               puertos, para probar mods y ajustes de riesgo antes de tocar
#               produccion. Perfil `staging`, asi que no arranca por defecto.
#   pz-vanilla  referencia sin mods. Mismo mapa, misma semilla y mismos ajustes
#               que produccion, pero mundo generado de cero y CERO mods. Sirve
#               para distinguir "esto falla por un mod" de "esto es asi en
#               Build 42". Perfil `vanilla`.
#
# Levantar produccion:   docker compose up -d
# Levantar staging:      ./scripts/stage.sh
# Levantar vanilla:      docker compose --profile vanilla up -d pz-vanilla
# ============================================================================

x-pz-common: &pz-common
  build:
    context: .
    dockerfile: Dockerfile
  image: zroyecto-pombie:latest
  env_file:
    - .env

  # stdin abierto: el servidor lee comandos de consola por ahi. Con stdin
  # cerrado algunas versiones se comen una CPU entera girando sobre EOF.
  stdin_open: true
  tty: false

  # LA LINEA MAS IMPORTANTE DEL FICHERO.
  # Por defecto Docker manda SIGKILL 10 segundos despues del SIGTERM. El
  # guardado de un mundo poblado tarda bastante mas, asi que sin este margen
  # todo el apagado seguro que implementa el contenedor se queda a medias y
  # acabamos justo en el escenario que queriamos evitar.
  stop_grace_period: 180s

  restart: unless-stopped

  # Techo de memoria del contenedor. Sin esto el unico limite es la RAM de la
  # maquina. El heap del JVM son PZ_MEMORY, pero el consumo real suma metaspace,
  # pilas de hilos, buffers directos y el propio GC, y se va bastante por encima.
  # Quedarse sin memoria sin limite declarado significa que el OOM killer del
  # kernel elige victima por su cuenta; si le toca al JVM en mitad de un
  # guardado, sale justo el mundo corrupto que todo este montaje existe para
  # evitar, porque un SIGKILL del kernel no espera al apagado seguro.
  #
  # 10g deja margen de sobra sobre lo esperado con un heap de 6g: en operacion
  # normal no deberia activarse nunca. Si se activa es que algo va mal, y al
  # menos muere el proceso correcto en vez de la base de datos de al lado.
  # No se limita el swap a proposito: degradado pero vivo es preferible a
  # muerto, porque de un servidor lento se sale y de un guardado a medias no.
  mem_limit: 10g

  # El contenedor arranca como root porque el entrypoint necesita serlo para
  # ajustar UID/GID y ceder el control con gosu, pero no necesita ni de lejos
  # el juego completo de capabilities por defecto: sobran NET_RAW, MKNOD,
  # SYS_CHROOT y compania. Se dejan solo las cinco que se usan de verdad:
  #
  #   CHOWN          el chown -R de los volumenes, y tar -x preservando duenos
  #   DAC_OVERRIDE   escribir durante ese ajuste en ficheros de otro dueno
  #   FOWNER         usermod/groupmod tocando /etc/passwd y /etc/group
  #   SETUID SETGID  gosu bajando de root a steam
  #
  # no-new-privileges cierra la escalada via binarios setuid. No estorba a gosu:
  # gosu no es setuid, deja privilegios en vez de cogerlos.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID

  healthcheck:
    test: ["CMD-SHELL", "rcon -a 127.0.0.1:27015 -p \"$$PZ_RCON_PASSWORD\" -t rcon players >/dev/null 2>&1 || exit 1"]
    interval: 60s
    timeout: 10s
    retries: 3
    # El primer arranque descarga 8 GB y genera el mundo. Sin este margen el
    # contenedor se marcaria como enfermo antes siquiera de empezar.
    start_period: 900s

  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  pz:
    <<: *pz-common
    container_name: pombie-pz
    hostname: pombie

    ports:
      # UDP, no TCP. Es el error de configuracion mas comun al abrir puertos:
      # una regla TCP se ve perfecta en el router y no sirve absolutamente de
      # nada. Ambos puertos hacen falta: 16261 es el principal y 16262 el de
      # conexion directa.
      #
      # HOST_BIND_IP decide EN QUE INTERFAZ escucha. Con la IP de Tailscale, el
      # servidor solo existe dentro del tailnet y las ACL deciden quien entra.
      # Dejarlo en 0.0.0.0 lo publica tambien en la WiFi de casa, y ahi no hay
      # ACL que valga: quien este en la misma red entra por la puerta de al lado.
      # La IP va en el .env, no aqui: es propia de cada maquina.
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_GAME_PORT:-16261}:16261/udp"
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_GAME_PORT_2:-16262}:16262/udp"
      # RCON solo en loopback. Da control total del servidor: exponerlo a la
      # red seria regalar la administracion a cualquiera que pruebe la clave.
      - "127.0.0.1:${HOST_RCON_PORT:-27015}:27015/tcp"

    volumes:
      - pz-game:/opt/pz-server        # instalacion (~8 GB), desechable
      - pz-data:/home/steam/Zomboid   # SAVES, db, config runtime: irremplazable
      - ./config:/config              # fuente de verdad de la configuracion
      - ./backups:/backups            # tarballs, y vehiculo de migracion

  pz-staging:
    <<: *pz-common
    container_name: pombie-staging
    hostname: pombie-staging
    profiles: ["staging"]
    restart: "no"

    environment:
      # OJO: staging usa EL MISMO PZ_SERVER_NAME que produccion, a proposito.
      #
      # El nombre del servidor da nombre a la carpeta de guardado
      # (Saves/Multiplayer/<nombre>) y a la base de datos. Si aqui pusieramos un
      # nombre distinto, staging restauraria la copia de produccion y luego
      # generaria un mundo nuevo y vacio a su lado, ignorandola. Es decir,
      # estariamos probando los mods sobre un mundo recien creado en vez de
      # sobre el mundo real, que es exactamente lo que staging existe para
      # evitar. El aislamiento lo dan los volumenes separados, no el nombre.
      PZ_PUBLIC: "false"

      # Los puertos INTERNOS de staging tienen que coincidir con los que
      # publicamos, no valen los de produccion.
      #
      # El servidor le anuncia al cliente los puertos que tiene configurados en
      # su propio INI. Si dentro dice 16261/16262 pero fuera esta publicado en
      # 16361/16362, el cliente conecta bien al 16361, y acto seguido el
      # servidor le manda seguir por el 16262... que en la maquina del host es
      # PRODUCCION. El handshake empieza y se pierde por el camino, sin error.
      PZ_PORT: "${STAGING_GAME_PORT:-16361}"
      PZ_UDP_PORT: "${STAGING_GAME_PORT_2:-16362}"

      # Staging comparte config/ y .env con produccion, asi que sin esto no
      # habria forma de probar un mod aqui sin metérselo tambien a produccion,
      # que es justo lo que staging existe para evitar.
      #
      # Con esto activo, staging usa STAGING_WORKSHOP_ITEMS y STAGING_MODS del
      # .env si estan definidos. Si estan vacios, replica los de produccion:
      # el comportamiento por defecto es ser una copia fiel.
      PZ_USE_STAGING_MODS: "true"

      # Los backups de staging llevan otro prefijo para que no se confundan
      # nunca con los de produccion en la carpeta compartida ./backups.
      BACKUP_NAME_PREFIX: "staging"
      BACKUP_INTERVAL_HOURS: "0"
      BACKUP_ON_START: "false"

      # Aqui si aceptamos cambios de version: es el sitio para probarlos.
      ALLOW_BUILD_CHANGE: "true"

    ports:
      # Mapeo 1:1 a proposito. Traducir puertos aqui rompe la conexion, porque
      # el servidor anuncia los suyos internos y el cliente acaba hablando al
      # puerto equivocado del host.
      - "${HOST_BIND_IP:-0.0.0.0}:${STAGING_GAME_PORT:-16361}:${STAGING_GAME_PORT:-16361}/udp"
      - "${HOST_BIND_IP:-0.0.0.0}:${STAGING_GAME_PORT_2:-16362}:${STAGING_GAME_PORT_2:-16362}/udp"
      - "127.0.0.1:${STAGING_RCON_PORT:-27115}:27015/tcp"

    volumes:
      # Volumenes propios, incluido el del juego. Compartir la instalacion con
      # produccion ahorraria 8 GB pero romperia el aislamiento justo donde mas
      # importa: al descargar mods, Steam actualizaria tambien los que
      # produccion esta usando ahora mismo. El disco es mas barato que eso.
      - pz-game-staging:/opt/pz-server
      - pz-data-staging:/home/steam/Zomboid
      - ./config:/config
      - ./backups:/backups

  # ==========================================================================
  # pz-vanilla - el MISMO mundo, con lista de mods corta y propia.
  #
  # No es staging y no lo sustituye. Staging existe para ensayar un cambio
  # antes de meterlo en produccion; esto nacio para responder una pregunta
  # distinta: cuando algo se comporta raro en juego, saber si la causa son los
  # mods o es el juego base.
  #
  # Nacio sin ningun mod, que era lo que permitia distinguir "esto falla" de
  # "esto es asi en Build 42". Se le anadieron siete de interfaz a peticion de
  # quienes juegan aqui, asi que esa funcion queda a medias: sirve para
  # descartar los 26 que no lleva, no para medir la linea base del juego limpio.
  #
  # Por eso tiene NOMBRE PROPIO, al reves que staging: aqui no queremos una
  # copia indistinguible, queremos poder tener las dos y comparar.
  #
  # Levantar:  docker compose --profile vanilla up -d pz-vanilla
  # ==========================================================================
  pz-vanilla:
    <<: *pz-common
    container_name: pombie-vanilla
    hostname: pombie-vanilla
    profiles: ["vanilla"]
    restart: "no"

    environment:
      # Nombre distinto al de produccion. Da nombre a la carpeta de guardado y
      # a la base de datos, asi que el mundo copiado hay que renombrarlo dentro
      # del volumen para que este servidor lo encuentre; si no, generaria uno
      # nuevo y vacio al lado e ignoraria la copia.
      PZ_SERVER_NAME: "${VANILLA_SERVER_NAME:-pombie-vanilla}"
      PZ_PUBLIC_NAME: "Zroyecto Pombie (vanilla)"
      PZ_PUBLIC: "false"

      # Lista PROPIA de mods, corta y deliberada. Se define aqui y no en el .env
      # porque `environment` tiene prioridad sobre `env_file`: asi produccion
      # conserva su lista de 33 intacta pase lo que pase aqui.
      #
      # PZ_USE_STAGING_MODS queda en false a proposito: con true, una lista
      # vacia significaria "replica los mods de produccion", que es justo lo
      # contrario de lo que queremos aqui.
      #
      # ---- Criterio de admision, y por que es tan estrecho ----
      #
      # Este mundo estaba EMPEZADO cuando se anadieron. La regla que lo hace
      # seguro es que ninguno declare entidades: sin `media/scripts`, un mod no
      # puede meter objetos, construibles, vehiculos ni tiles en el mundo, asi
      # que ni al ponerlo ni al quitarlo puede dejar referencias colgando en el
      # WorldDictionary. Comprobado fichero a fichero sobre lo que hay
      # descargado, no leyendo descripciones del Workshop: los siete dan cero
      # scripts, cero items, cero entities y cero tiles.
      #
      # Contraste que lo ilustra: la variante `Neat_Building` completa trae 441
      # ficheros de entidades; `Neat_Building_UIOnly`, que es la que va aqui,
      # trae 0. Su propio autor avisa de que quitar una variante con
      # construibles de un mundo existente puede impedir que el mundo cargue.
      #
      # Quedan FUERA los seis de inventario y contenedores (CleanUI, Proximity
      # Inventory, Nested Containers, Manage Containers, Better Sorting y Split
      # Items) pese a ser tambien de interfaz: son la "zona de riesgo" que
      # documenta MODS-LISTA.md y, sobre todo, la incidencia 004 tiene como
      # mejor indicio 54 casos de `ItemContainer.AddItem: container already has
      # id`, que es un problema de contenedores. Mientras no se descarte, no se
      # puede afirmar que no sean responsables.
      #
      # ORDEN DE CARGA: NeatUI_Framework va el primero. Lo exigen Neat Crafting,
      # Neat Building y Modern Status.
      PZ_USE_STAGING_MODS: "false"
      PZ_WORKSHOP_ITEMS: "${VANILLA_WORKSHOP_ITEMS:-3508537032;3536052310;3502080466;3451167732;2734705913;2544353492;3399645148}"
      PZ_MODS: "${VANILLA_MODS:-NeatUI_Framework;Neat_Building_UIOnly;Neat_Crafting;ModernStatus;MapSymbolSizeSlider;P4HasBeenRead;MapSymbolsPlusDeonHand}"

      # Los puertos INTERNOS deben coincidir con los publicados. El servidor le
      # anuncia al cliente los suyos: si dentro dijera 16261, el cliente
      # acabaria hablando con PRODUCCION a mitad del handshake.
      PZ_PORT: "${VANILLA_GAME_PORT:-16461}"
      PZ_UDP_PORT: "${VANILLA_GAME_PORT_2:-16462}"

      # Sin mods consume bastante menos, y asi caben los dos en la maquina si
      # algun dia hace falta compararlos en caliente.
      PZ_MEMORY: "${VANILLA_MEMORY:-3g}"
      PZ_MEMORY_MIN: "1g"

      # Prefijo propio para que sus backups no se confundan con los de
      # produccion en la carpeta compartida. La rotacion es por prefijo, asi
      # que ninguna instancia puede borrar los backups de otra.
      BACKUP_NAME_PREFIX: "vanilla"

      # Nacio sin backup automatico —"mundo de comparacion, desechable por
      # definicion"— y esa premisa dejo de ser cierta: se juega en el, tiene
      # cuatro personajes y un mundo mas grande que el de produccion. Un mundo
      # en el que alguien invierte horas no es desechable por mucho que asi se
      # concibiera, asi que hereda de .env lo mismo que produccion.
      #
      # Staging si conserva la exencion: ahi el mundo es literalmente una copia
      # que stage.sh rehace cuando quiere.

      # Es una copia: aceptamos abrirla con otra version si hiciera falta.
      ALLOW_BUILD_CHANGE: "true"

    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${VANILLA_GAME_PORT:-16461}:${VANILLA_GAME_PORT:-16461}/udp"
      - "${HOST_BIND_IP:-0.0.0.0}:${VANILLA_GAME_PORT_2:-16462}:${VANILLA_GAME_PORT_2:-16462}/udp"
      - "127.0.0.1:${VANILLA_RCON_PORT:-27215}:27015/tcp"

    volumes:
      - pz-game-vanilla:/opt/pz-server
      - pz-data-vanilla:/home/steam/Zomboid
      - ./config:/config
      - ./backups:/backups

volumes:
  pz-game:
  pz-data:
  pz-game-staging:
  pz-data-staging:
  pz-game-vanilla:
  pz-data-vanilla:
